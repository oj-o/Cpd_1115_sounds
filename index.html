<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>저승관리청 음향 큐</title>
<style>
/* 레이아웃: 음향 부스용 어두운 콘솔 — 왼쪽 큐 목록, 오른쪽 GO·대기 큐·재생 중 패널 */
:root{
  --bg:#0f0e14; --panel:#18161f; --raise:#211e2b; --line:#2e2a3b;
  --fg:#ece9f5; --muted:#9590a8; --accent:#9d8cff; --go:#2fbf71; --warn:#ffb648; --stop:#ff5c5c;
  --ui:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"D2Coding",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--ui);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.status{color:var(--muted);font-size:13px}
.status.bad{color:var(--warn)}
.spacer{flex:1}
.clock{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
label.mv{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
input[type=range]{accent-color:var(--accent)}

/* 큐 목록 */
.list{overflow:auto;padding:0 0 24px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding:6px 10px;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.cue{cursor:pointer}
tr.cue:hover td{background:var(--raise)}
tr.cue.standby td{background:color-mix(in srgb,var(--go) 16%,var(--bg))}
tr.cue.standby td:first-child{box-shadow:inset 4px 0 0 var(--go)}
tr.cue.done td{color:var(--muted)}
tr.cue.playing .id{color:var(--go)}
.id{font:700 16px var(--mono);color:var(--accent);white-space:nowrap}
.scene{color:var(--muted);font-size:12px;white-space:nowrap}
.ttl{font-weight:600}
.timing{color:var(--muted);font-size:13px;margin-top:2px}
.note{color:var(--warn);font-size:12px;margin-top:2px}
.tags{white-space:nowrap;font:12px var(--mono);color:var(--muted);text-align:right}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px}
.tag.loop{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.tag.stop{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 50%,transparent)}
.tag.missing{color:var(--warn);border-color:var(--warn)}

/* 오른쪽 패널 */
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.next{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.nextcue{display:flex;gap:12px;align-items:baseline}
.nextcue .id{font-size:28px;color:var(--go)}
.nextcue .ttl{font-size:18px}
#go{all:unset;box-sizing:border-box;height:96px;border-radius:12px;background:var(--go);color:#062814;font:800 40px var(--ui);text-align:center;cursor:pointer;letter-spacing:.06em;display:grid;place-items:center;user-select:none}
#go:active{transform:translateY(1px);filter:brightness(.9)}
#go:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#go.pz{background:var(--warn);color:#2a1a00;font-size:30px;line-height:1.15}
#go.pz.resume{background:var(--accent);color:#120a33}
#go small{display:block;font:600 13px var(--ui);letter-spacing:0;opacity:.8}
#go[disabled]{background:var(--raise);color:var(--muted);cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fsel{display:flex;align-items:center;gap:8px}
.fsel .lbl{flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);flex:1;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;box-sizing:border-box;text-align:center;padding:7px 0;cursor:pointer;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--warn);color:#2a1a00}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.btn{all:unset;box-sizing:border-box;text-align:center;padding:10px;border-radius:8px;background:var(--raise);border:1px solid var(--line);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--accent)}
.btn.stop{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 45%,transparent)}
.keys{font-size:12px;color:var(--muted)}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--raise);color:var(--fg)}
.active{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:13px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .row{display:flex;align-items:center;gap:10px}
.card .id{font-size:15px}
.card .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font:13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go)}
.card.fading .bar i{background:var(--warn)}
.card.loop .bar i{background:var(--accent)}
.mini{all:unset;cursor:pointer;font-size:12px;padding:3px 8px;white-space:nowrap;flex-shrink:0;border-radius:6px;border:1px solid var(--line)}
.mini:hover{border-color:var(--muted)}
.mini.x{color:var(--stop)}
.mini.p{min-width:52px;text-align:center}
.card.paused{border-color:var(--warn)}
.card.paused .bar i{background:var(--muted)}
.card.paused [data-t]{color:var(--warn)}
.btn.pause[aria-pressed=true]{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.card input[type=range]{flex:1;min-width:0}

@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);order:-1}
  .list{overflow:visible}
  .scene,.tags{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>저승공무원으로 취업했습니다!!! · 음향 큐</h1>
    <span class="status">v2026.11.14d · GO 버튼으로 일시정지 · 14큐</span>
    <span class="status" id="status">음원 확인 중…</span>
    <span class="spacer"></span>
    <label class="mv" for="master">마스터 <input id="master" type="range" min="0" max="100" value="100"> <span id="mvv" class="time">100</span></label>
    <span class="clock" id="clock">00:00:00</span>
  </header>

  <main class="list">
    <table>
      <thead><tr><th>큐</th><th>장</th><th>내용 / 타이밍</th><th style="text-align:right">길이</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <aside>
    <section class="next">
      <span class="lbl">대기 큐 (STANDBY)</span>
      <div class="nextcue"><span class="id" id="nId">–</span><span class="ttl" id="nTitle">–</span></div>
      <div class="timing" id="nTiming"></div>
      <button id="go" type="button">GO</button>
      <div class="fsel"><span class="lbl">페이드 시간</span>
        <div class="seg" role="group" aria-label="페이드 시간">
          <button type="button" data-sec="3" aria-pressed="true">3초</button><button type="button" data-sec="5" aria-pressed="false">5초</button><button type="button" data-sec="10" aria-pressed="false">10초</button>
        </div>
      </div>
      <div class="btns">
        <button class="btn pause" id="pauseAll" type="button" aria-pressed="false">일시정지</button>
        <button class="btn" id="fadeAll" type="button">전체 페이드 (3초)</button>
        <button class="btn stop" id="stopAll" type="button">전체 정지</button>
      </div>
      <div class="keys"><kbd>Space</kbd> GO (단발 소리가 나오는 동안은 일시정지·이어서) · <kbd>Shift</kbd>+<kbd>Space</kbd> 무조건 다음 큐 GO · <kbd>↑</kbd><kbd>↓</kbd> 대기 큐 이동 · <kbd>P</kbd> 일시정지·이어서 · <kbd>F</kbd> 전체 페이드 · <kbd>3</kbd><kbd>5</kbd><kbd>0</kbd> 페이드 3·5·10초 선택 · <kbd>Esc</kbd> 전체 정지 · 큐를 두 번 클릭하면 바로 재생</div>
    </section>
    <section class="active" id="active"><p class="empty">재생 중인 큐가 없습니다.</p></section>
  </aside>
</div>

<script src="cues.js?v=20261114b"></script>
<script>
(() => {
  const CUES = window.CUES || [];
  const $ = id => document.getElementById(id);
  let standby = 0, master = 1, lastGo = 0, uid = 0, fadeSec = 3, lastRun = null;
  const running = new Map();            // uid -> {cue, audio, base, gain, fadeTimer, card, ...}
  const pool = new Map();               // src -> preloaded Audio
  const missing = new Set();

  // ── 음원 미리 불러오기 ──
  const srcs = [...new Set(CUES.filter(c => c.type === "audio").map(c => c.src))];
  let ready = 0;
  const updStatus = () => {
    const s = $("status");
    if (missing.size) { s.textContent = `음원 ${missing.size}개를 찾을 수 없음 (목록의 ! 표시 확인)`; s.className = "status bad"; }
    else s.textContent = ready === srcs.length ? `음원 ${ready}개 준비 완료` : `음원 준비 중 ${ready}/${srcs.length}`;
  };
  srcs.forEach(src => {
    const a = new Audio(); a.preload = "auto";
    a.addEventListener("canplaythrough", () => { ready++; updStatus(); }, { once: true });
    a.addEventListener("loadedmetadata", () => {          // 실제 파일 길이로 표시 (음원을 바꿔도 맞게)
      CUES.forEach(c => { if (c.src === src && isFinite(a.duration)) c.dur = Math.round(a.duration * 10) / 10; });
      render();
    }, { once: true });
    a.addEventListener("error", () => { missing.add(src); render(); updStatus(); }, { once: true });
    a.src = src; a.load(); pool.set(src, a);
  });
  updStatus();

  // ── 큐 목록 ──
  const fmt = s => { s = Math.max(0, s || 0); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`; };
  function render() {
    const tb = $("rows"); tb.innerHTML = "";
    CUES.forEach((c, i) => {
      const tr = document.createElement("tr"); tr.className = "cue"; tr.dataset.i = i;
      if (i === standby) tr.classList.add("standby");
      if (c._done) tr.classList.add("done");
      if ([...running.values()].some(r => r.cue === c)) tr.classList.add("playing");
      const tags = [];
      if (c.type === "stop") tags.push(`<span class="tag stop">${c.targets ? c.targets.join("·") + "번 " : ""}정지${c.fade ? " " + c.fade + "s" : ""}</span>`);
      if (c.voice) tags.push('<span class="tag">녹음</span>');
      if (c.loop) tags.push('<span class="tag loop">반복</span>');
      if (c.fadeIn) tags.push(`<span class="tag">F.I ${c.fadeIn}s</span>`);
      if (c.fadeOthers) tags.push(`<span class="tag">이전 F.O ${c.fadeOthers}s</span>`);
      if (c.src && missing.has(c.src)) tags.push('<span class="tag missing">! 파일 없음</span>');
      tr.innerHTML = `<td class="id">${c.id}</td><td class="scene">${c.scene || ""}</td>
        <td><div class="ttl">${c.title}</div><div class="timing">${c.timing || ""}</div>${c.note ? `<div class="note">${c.note}</div>` : ""}</td>
        <td class="tags">${c.type === "audio" && c.dur ? (c.dur < 60 ? c.dur.toFixed(1) + "초" : fmt(c.dur)) : ""}<br>${tags.join("")}</td>`;
      tr.addEventListener("click", () => setStandby(i));
      tr.addEventListener("dblclick", () => { setStandby(i); go(); });
      tb.appendChild(tr);
    });
    const c = CUES[standby];
    $("nId").textContent = c ? c.id : "–";
    $("nTitle").textContent = c ? c.title : "마지막 큐까지 진행했습니다";
    $("nTiming").textContent = c ? c.timing || "" : "";
    drawGo();
  }
  // GO 버튼 = 방금 GO한 소리(단발)가 나오는 동안은 일시정지·이어서 버튼
  //  · 반복 큐(벨소리·입장 음악) 뒤, 또는 다음 큐가 정지 큐면 언제나 GO
  function pauseTarget() {
    const r = lastRun;
    if (!r || !running.has(r.uid) || r.cue.loop || r.fading) return null;
    const n = CUES[standby];
    if (n && n.type === "stop") return null;
    return r;
  }
  function drawGo() {
    const b = $("go"), r = pauseTarget(), c = CUES[standby];
    if (r) {
      b.disabled = false; b.className = "pz" + (r.paused ? " resume" : "");
      b.innerHTML = `${r.paused ? "▶ 이어서" : "❚❚ 일시정지"}<small>${r.cue.id} ${r.cue.title} · 끝나면 다시 GO</small>`;
    } else { b.className = ""; b.textContent = "GO"; b.disabled = !c; }
  }
  function setStandby(i, scroll = true) {
    standby = Math.max(0, Math.min(CUES.length, i)); render();
    if (scroll) document.querySelector("tr.standby")?.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  // ── 재생 / 페이드 ──
  const apply = r => { r.audio.volume = Math.max(0, Math.min(1, r.base * r.gain * master)); };
  function ramp(r, to, sec, done) {
    clearInterval(r.fadeTimer);
    if (!sec) { r.gain = to; apply(r); done && done(); return; }
    const from = r.gain, t0 = performance.now();
    r.fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / (sec * 1000));
      r.gain = from + (to - from) * (1 - Math.cos(Math.PI * k)) / 2; apply(r);
      if (k >= 1) { clearInterval(r.fadeTimer); done && done(); }
    }, 20);
  }
  function stopRun(r, sec = 0) {
    if (!running.has(r.uid)) return;
    if (r.paused) sec = 0;                                   // 멈춘 소리는 바로 끔
    if (sec > 0) { r.fading = true; r.card.classList.add("fading"); ramp(r, 0, sec, () => kill(r)); drawGo(); }
    else kill(r);
  }
  function kill(r) {
    clearInterval(r.fadeTimer); r.audio.pause(); r.audio.currentTime = 0;
    running.delete(r.uid); r.card.remove(); drawActive(); render(); syncPause();
  }
  function stopAll(sec = 0) { [...running.values()].forEach(r => stopRun(r, sec)); }

  // ── 일시정지 / 이어서 ──
  function pauseRun(r) {
    if (r.paused) return;
    clearInterval(r.fadeTimer); r.audio.pause(); r.paused = true;
    r.card.classList.add("paused"); r.card.querySelector("[data-p]").textContent = "▶ 이어서";
    syncPause(); drawGo();
  }
  function resumeRun(r) {
    if (!r.paused) return;
    r.paused = false; r.card.classList.remove("paused"); r.card.querySelector("[data-p]").textContent = "❚❚ 멈춤";
    r.audio.play().catch(() => {});
    if (r.fading) ramp(r, 0, fadeSec, () => kill(r));        // 페이드 중 멈췄으면 남은 페이드를 이어서
    syncPause(); drawGo();
  }
  const togglePause = r => r.paused ? resumeRun(r) : pauseRun(r);
  function pauseAllToggle() {
    const rs = [...running.values()];
    if (!rs.length) return;
    if (rs.some(r => !r.paused)) rs.forEach(pauseRun); else rs.forEach(resumeRun);
  }
  function syncPause() {
    const rs = [...running.values()], all = rs.length > 0 && rs.every(r => r.paused);
    const b = $("pauseAll"); b.textContent = all ? "▶ 이어서 재생" : "❚❚ 일시정지"; b.setAttribute("aria-pressed", String(all));
  }
  function stopIds(ids, sec = 0) { [...running.values()].filter(r => ids.includes(r.cue.id)).forEach(r => stopRun(r, sec)); }

  function play(c) {
    if (c.fadeOthers !== undefined) stopAll(c.fadeOthers);
    if (c.type === "stop") { c.targets ? stopIds(c.targets, c.fade || 0) : stopAll(c.fade || 0); return; }
    let a = pool.get(c.src);
    if (!a || [...running.values()].some(r => r.audio === a)) { a = new Audio(c.src); }
    a.loop = !!c.loop; a.currentTime = 0;
    const r = { uid: ++uid, cue: c, audio: a, base: c.vol ?? 1, gain: c.fadeIn ? 0 : 1 };
    apply(r);
    a.play().catch(e => { $("status").textContent = `재생 실패: ${c.src} (${e.name})`; $("status").className = "status bad"; });
    if (c.fadeIn) ramp(r, 1, c.fadeIn);
    a.onended = () => { if (!a.loop) kill(r); };
    r.card = makeCard(r); running.set(r.uid, r); lastRun = r; drawActive(); syncPause();
  }
  function goOrPause() {
    const r = pauseTarget();
    if (r) { const now = performance.now(); if (now - lastGo < 250) return; lastGo = now; togglePause(r); return; }
    go();
  }
  function go() {
    const now = performance.now(); if (now - lastGo < 250) return; lastGo = now;   // 이중 입력 방지
    const c = CUES[standby]; if (!c) return;
    c._done = true; play(c); setStandby(standby + 1);
  }

  // ── 재생 중 패널 ──
  function makeCard(r) {
    const c = r.cue, el = document.createElement("div");
    el.className = "card" + (c.loop ? " loop" : "");
    el.innerHTML = `<div class="row"><span class="id">${c.id}</span><span class="ttl">${c.title}</span><span class="time" data-t>0:00</span></div>
      <div class="bar"><i></i></div>
      <div class="row"><input type="range" min="0" max="100" value="${Math.round(r.base * 100)}" aria-label="큐 ${c.id} 볼륨">
      <button class="mini p" type="button" data-p>❚❚ 멈춤</button><button class="mini" type="button" data-f>페이드 ${fadeSec}s</button><button class="mini x" type="button" data-s>정지</button></div>`;
    el.querySelector("input").oninput = e => { r.base = e.target.value / 100; apply(r); };
    el.querySelector("[data-p]").onclick = () => togglePause(r);
    el.querySelector("[data-f]").onclick = () => stopRun(r, fadeSec);
    el.querySelector("[data-s]").onclick = () => stopRun(r, 0);
    return el;
  }
  function drawActive() {
    const box = $("active"); box.innerHTML = "";
    if (!running.size) { box.innerHTML = '<p class="empty">재생 중인 큐가 없습니다.</p>'; return; }
    [...running.values()].reverse().forEach(r => box.appendChild(r.card));
  }
  setInterval(() => {
    running.forEach(r => {
      const d = r.audio.duration || r.cue.dur || 0, t = r.audio.currentTime;
      r.card.querySelector(".bar i").style.width = d ? (100 * (t % d) / d) + "%" : "0";
      r.card.querySelector("[data-t]").textContent = r.cue.loop ? `${fmt(t)} 반복` : `-${fmt(d - t)}`;
    });
    const n = new Date(); $("clock").textContent = n.toTimeString().slice(0, 8);
  }, 100);

  // ── 조작 ──
  $("go").onclick = goOrPause;
  function setFade(sec) {
    fadeSec = sec;
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.sec === sec)));
    $("fadeAll").textContent = `전체 페이드 (${sec}초)`;
    running.forEach(r => { const b = r.card.querySelector("[data-f]"); if (b) b.textContent = `페이드 ${sec}s`; });
    try { localStorage.setItem("fadeSec", String(sec)); } catch (e) {}
  }
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setFade(+b.dataset.sec));
  try { const v = +localStorage.getItem("fadeSec"); if ([3, 5, 10].includes(v)) setFade(v); } catch (e) {}
  $("pauseAll").onclick = pauseAllToggle; syncPause();
  $("fadeAll").onclick = () => stopAll(fadeSec);
  $("stopAll").onclick = () => stopAll(0);
  $("master").oninput = e => { master = e.target.value / 100; $("mvv").textContent = e.target.value; running.forEach(apply); };
  document.addEventListener("keydown", e => {
    if (e.target.matches("input")) { if (e.code !== "Space" && e.key !== "Escape") return; e.target.blur(); }
    if (e.code === "Space") { e.preventDefault(); if (!e.repeat) (e.shiftKey ? go : goOrPause)(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setStandby(standby + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setStandby(standby - 1); }
    else if (e.key === "Escape") { e.preventDefault(); stopAll(0); }
    else if (e.key === "f" || e.key === "F" || e.key === "ㄹ") { stopAll(fadeSec); }
    else if (e.key === "p" || e.key === "P" || e.key === "ㅔ") { pauseAllToggle(); }
    else if (e.key === "3") setFade(3);
    else if (e.key === "5") setFade(5);
    else if (e.key === "0") setFade(10);
  });
  render();
})();
</script>
</body>
</html>
